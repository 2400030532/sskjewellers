<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
  <defs>
    <linearGradient id="chokerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="20%" stop-color="#f5d070"/>
      <stop offset="50%" stop-color="#e5b438"/>
      <stop offset="80%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#694600"/>
    </linearGradient>
    <radialGradient id="rubyGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b91"/>
      <stop offset="45%" stop-color="#d61c4e"/>
      <stop offset="85%" stop-color="#800b28"/>
      <stop offset="100%" stop-color="#400010"/>
    </radialGradient>
    <radialGradient id="emeraldGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8affc4"/>
      <stop offset="40%" stop-color="#00ab6b"/>
      <stop offset="85%" stop-color="#025e3b"/>
      <stop offset="100%" stop-color="#002d1c"/>
    </radialGradient>
    <radialGradient id="ricePearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdf9f0"/>
      <stop offset="80%" stop-color="#ebe0c7"/>
      <stop offset="100%" stop-color="#bda984"/>
    </radialGradient>
    <filter id="chokerShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#chokerShadow)">
    <!-- 1. Upper Gold Mesh / Choker Band Contour (Graceful Neck Curve) -->
    <path d="M 40 45 Q 230 115 420 45 Q 230 145 40 45 Z" fill="url(#chokerGold)" stroke="#996515" stroke-width="2"/>
    
    <!-- Top Beaded Border Line -->
    <path d="M 46 47 Q 230 115 414 47" fill="none" stroke="#fff8cc" stroke-width="3" stroke-dasharray="3,4"/>

    <!-- Middle Inset Gemstone Filigree Band -->
    <path d="M 52 58 Q 230 125 408 58" fill="none" stroke="#7a5500" stroke-width="6"/>

    <!-- Segmented Kemp Ruby Gemstones Along Neckline -->
    <!-- Left quadrant -->
    <circle cx="80" cy="58" r="4.5" fill="url(#rubyGem)"/>
    <circle cx="110" cy="67" r="4.5" fill="url(#rubyGem)"/>
    <circle cx="140" cy="77" r="5" fill="url(#rubyGem)"/>
    <circle cx="170" cy="87" r="5.5" fill="url(#rubyGem)"/>
    <circle cx="200" cy="95" r="6" fill="url(#rubyGem)"/>

    <!-- Right quadrant -->
    <circle cx="260" cy="95" r="6" fill="url(#rubyGem)"/>
    <circle cx="290" cy="87" r="5.5" fill="url(#rubyGem)"/>
    <circle cx="320" cy="77" r="5" fill="url(#rubyGem)"/>
    <circle cx="350" cy="67" r="4.5" fill="url(#rubyGem)"/>
    <circle cx="380" cy="58" r="4.5" fill="url(#rubyGem)"/>

    <!-- 2. Grand Central Nakshi Floral / Royal Pendant Medallion -->
    <circle cx="230" cy="115" r="22" fill="url(#chokerGold)" stroke="#b8860b" stroke-width="2.5"/>
    <circle cx="230" cy="115" r="18" fill="none" stroke="#fff8cc" stroke-width="2" stroke-dasharray="2,3"/>
    
    <!-- Emerald Centerpiece -->
    <rect x="220" y="105" width="20" height="20" rx="4" fill="url(#emeraldGem)" stroke="#f5d070" stroke-width="2"/>
    <circle cx="226" cy="110" r="2" fill="#ffffff" opacity="0.75"/>

    <!-- Surrounding Ruby Halos on Center Medallion -->
    <circle cx="230" cy="90" r="4" fill="url(#rubyGem)"/>
    <circle cx="248" cy="98" r="4" fill="url(#rubyGem)"/>
    <circle cx="254" cy="116" r="4" fill="url(#rubyGem)"/>
    <circle cx="248" cy="132" r="4" fill="url(#rubyGem)"/>
    <circle cx="230" cy="140" r="4" fill="url(#rubyGem)"/>
    <circle cx="212" cy="132" r="4" fill="url(#rubyGem)"/>
    <circle cx="206" cy="116" r="4" fill="url(#rubyGem)"/>
    <circle cx="212" cy="98" r="4" fill="url(#rubyGem)"/>

    <!-- 3. Guttapusalu: Clusters of Rice Pearls (Gutta Pusalu bunches hanging below band) -->
    <!-- Helper macro representations of pearl bunches along lower arc -->
    <!-- Cluster 1 (Left Far) -->
    <g transform="translate(90, 72)">
      <circle cx="0" cy="12" r="4.2" fill="url(#ricePearl)"/>
      <circle cx="-5" cy="19" r="4.2" fill="url(#ricePearl)"/>
      <circle cx="5" cy="19" r="4.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="27" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="34" r="2" fill="#b8860b"/>
    </g>

    <!-- Cluster 2 -->
    <g transform="translate(125, 84)">
      <circle cx="0" cy="12" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="-6" cy="20" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="6" cy="20" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="29" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="0" cy="37" r="2.2" fill="#b8860b"/>
    </g>

    <!-- Cluster 3 -->
    <g transform="translate(160, 97)">
      <circle cx="0" cy="12" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="-7" cy="21" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="7" cy="21" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="-4" cy="30" r="5" fill="url(#ricePearl)"/>
      <circle cx="4" cy="30" r="5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="39" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="47" r="2.5" fill="#b8860b"/>
    </g>

    <!-- Cluster 4 -->
    <g transform="translate(195, 110)">
      <circle cx="0" cy="13" r="5" fill="url(#ricePearl)"/>
      <circle cx="-8" cy="23" r="5" fill="url(#ricePearl)"/>
      <circle cx="8" cy="23" r="5" fill="url(#ricePearl)"/>
      <circle cx="-4" cy="33" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="4" cy="33" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="43" r="5.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="52" r="2.8" fill="#b8860b"/>
    </g>

    <!-- Center Grand Drop (Below Medallion) -->
    <g transform="translate(230, 137)">
      <circle cx="0" cy="12" r="4" fill="url(#rubyGem)" stroke="#ffd700" stroke-width="1"/>
      <circle cx="-8" cy="22" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="8" cy="22" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="24" r="5.5" fill="url(#ricePearl)"/>
      <circle cx="-6" cy="34" r="5.5" fill="url(#ricePearl)"/>
      <circle cx="6" cy="34" r="5.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="46" r="7.5" fill="url(#ricePearl)"/>
      <circle cx="-2" cy="43" r="2" fill="#ffffff" opacity="0.8"/>
      <circle cx="0" cy="57" r="3.2" fill="#b8860b"/>
    </g>

    <!-- Cluster 5 -->
    <g transform="translate(265, 110)">
      <circle cx="0" cy="13" r="5" fill="url(#ricePearl)"/>
      <circle cx="-8" cy="23" r="5" fill="url(#ricePearl)"/>
      <circle cx="8" cy="23" r="5" fill="url(#ricePearl)"/>
      <circle cx="-4" cy="33" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="4" cy="33" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="43" r="5.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="52" r="2.8" fill="#b8860b"/>
    </g>

    <!-- Cluster 6 -->
    <g transform="translate(300, 97)">
      <circle cx="0" cy="12" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="-7" cy="21" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="7" cy="21" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="-4" cy="30" r="5" fill="url(#ricePearl)"/>
      <circle cx="4" cy="30" r="5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="39" r="5.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="47" r="2.5" fill="#b8860b"/>
    </g>

    <!-- Cluster 7 -->
    <g transform="translate(335, 84)">
      <circle cx="0" cy="12" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="-6" cy="20" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="6" cy="20" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="29" r="4.8" fill="url(#ricePearl)"/>
      <circle cx="0" cy="37" r="2.2" fill="#b8860b"/>
    </g>

    <!-- Cluster 8 (Right Far) -->
    <g transform="translate(370, 72)">
      <circle cx="0" cy="12" r="4.2" fill="url(#ricePearl)"/>
      <circle cx="-5" cy="19" r="4.2" fill="url(#ricePearl)"/>
      <circle cx="5" cy="19" r="4.2" fill="url(#ricePearl)"/>
      <circle cx="0" cy="27" r="4.5" fill="url(#ricePearl)"/>
      <circle cx="0" cy="34" r="2" fill="#b8860b"/>
    </g>
  </g>
</svg>
