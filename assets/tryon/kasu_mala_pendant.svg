<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="kasuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="25%" stop-color="#f5d070"/>
      <stop offset="50%" stop-color="#dfa01e"/>
      <stop offset="80%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#694600"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="40%" stop-color="#e6b83b"/>
      <stop offset="85%" stop-color="#ab7a0c"/>
      <stop offset="100%" stop-color="#6e4d00"/>
    </radialGradient>
    <radialGradient id="kempRuby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b91"/>
      <stop offset="45%" stop-color="#d61c4e"/>
      <stop offset="85%" stop-color="#800b28"/>
      <stop offset="100%" stop-color="#400010"/>
    </radialGradient>
    <radialGradient id="kempEmerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8affc4"/>
      <stop offset="40%" stop-color="#00ab6b"/>
      <stop offset="85%" stop-color="#025e3b"/>
      <stop offset="100%" stop-color="#002d1c"/>
    </radialGradient>
    <radialGradient id="kasuPearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdf9f0"/>
      <stop offset="80%" stop-color="#ebe0c7"/>
      <stop offset="100%" stop-color="#bda984"/>
    </radialGradient>
    <filter id="kasuShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#kasuShadow)">
    <!-- 1. Elegant Deep Haram Arc Chain -->
    <path d="M 60 30 Q 240 220 420 30" fill="none" stroke="url(#kasuGold)" stroke-width="8"/>
    <path d="M 60 30 Q 240 220 420 30" fill="none" stroke="#fff8cc" stroke-width="2" stroke-dasharray="3,4"/>

    <!-- 2. Stamped Lakshmi Kasu Gold Coins arrayed along arc -->
    <!-- Helper macro for Kasu coin: circle with ruby stud on top and embossed figure inside -->
    <!-- Left Branch Coins -->
    <g transform="translate(100, 65)">
      <circle cx="0" cy="-12" r="3" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="14" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <!-- Lakshmi figurine silhouette -->
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <g transform="translate(135, 98)">
      <circle cx="0" cy="-12" r="3" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="15" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <g transform="translate(170, 133)">
      <circle cx="0" cy="-12" r="3.2" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="16" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <g transform="translate(205, 165)">
      <circle cx="0" cy="-12" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="16.5" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="13.5" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <!-- Right Branch Coins -->
    <g transform="translate(275, 165)">
      <circle cx="0" cy="-12" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="16.5" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="13.5" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <g transform="translate(310, 133)">
      <circle cx="0" cy="-12" r="3.2" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="16" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <g transform="translate(345, 98)">
      <circle cx="0" cy="-12" r="3" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="15" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <g transform="translate(380, 65)">
      <circle cx="0" cy="-12" r="3" fill="url(#kempRuby)"/>
      <circle cx="0" cy="0" r="14" fill="url(#coinFace)" stroke="#996515" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#fff8cc" stroke-width="1" stroke-dasharray="2,2"/>
      <path d="M 0 -6 L -3 1 L 3 1 Z M -4 4 Q 0 7 4 4" fill="#996515" stroke="#996515" stroke-width="0.8"/>
    </g>

    <!-- 3. Central Grand Nakshi Peacock & Lakshmi Locket Pendant -->
    <g transform="translate(240, 205)">
      <!-- Main Shield / Locket Body -->
      <path d="M -38 -20 C -45 10, -35 45, 0 60 C 35 45, 45 10, 38 -20 C 15 -10, -15 -10, -38 -20 Z" fill="url(#kasuGold)" stroke="#996515" stroke-width="2"/>
      <path d="M -32 -14 C -38 12, -28 38, 0 52 C 28 38, 38 12, 32 -14" fill="none" stroke="#fff8cc" stroke-width="1.8" stroke-dasharray="2,3"/>

      <!-- Center Grand Gaja Lakshmi Frame -->
      <circle cx="0" cy="12" r="18" fill="url(#coinFace)" stroke="#996515" stroke-width="1.5"/>
      <circle cx="0" cy="12" r="14" fill="url(#kempEmerald)" stroke="#f5d070" stroke-width="1.5"/>
      <circle cx="-3" cy="9" r="2.5" fill="#ffffff" opacity="0.8"/>

      <!-- Surrounding Ruby Arch -->
      <circle cx="-16" cy="-4" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="0" cy="-9" r="4" fill="url(#kempRuby)"/>
      <circle cx="16" cy="-4" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="-22" cy="12" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="22" cy="12" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="-16" cy="28" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="16" cy="28" r="3.5" fill="url(#kempRuby)"/>
      <circle cx="0" cy="38" r="4" fill="url(#kempRuby)"/>

      <!-- 4. Hanging Pearl & Gold Cluster Drops -->
      <line x1="-24" y1="36" x2="-26" y2="58" stroke="#dfa01e" stroke-width="1.5"/>
      <circle cx="-26" cy="63" r="4.5" fill="url(#kasuPearl)"/>
      <circle cx="-26" cy="70" r="2" fill="#b8860b"/>

      <line x1="-12" y1="46" x2="-14" y2="70" stroke="#dfa01e" stroke-width="1.5"/>
      <circle cx="-14" cy="75" r="5" fill="url(#kasuPearl)"/>
      <circle cx="-14" cy="83" r="2.2" fill="#b8860b"/>

      <!-- Center Large Drop -->
      <line x1="0" y1="60" x2="0" y2="84" stroke="#dfa01e" stroke-width="2"/>
      <circle cx="0" cy="87" r="4" fill="url(#kempRuby)"/>
      <circle cx="0" cy="98" r="7.5" fill="url(#kasuPearl)"/>
      <circle cx="-2" cy="95" r="2" fill="#ffffff" opacity="0.8"/>
      <circle cx="0" cy="109" r="2.8" fill="#b8860b"/>

      <line x1="12" y1="46" x2="14" y2="70" stroke="#dfa01e" stroke-width="1.5"/>
      <circle cx="14" cy="75" r="5" fill="url(#kasuPearl)"/>
      <circle cx="14" cy="83" r="2.2" fill="#b8860b"/>

      <line x1="24" y1="36" x2="26" y2="58" stroke="#dfa01e" stroke-width="1.5"/>
      <circle cx="26" cy="63" r="4.5" fill="url(#kasuPearl)"/>
      <circle cx="26" cy="70" r="2" fill="#b8860b"/>
    </g>
  </g>
</svg>
