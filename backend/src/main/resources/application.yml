server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  web:
    cors:
      allowed-origins: ${FRONTEND_ORIGIN}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
management:
  endpoints:
    web:
      exposure:
        include: health