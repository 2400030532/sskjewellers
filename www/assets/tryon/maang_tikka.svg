<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" width="140" height="220">
  <defs>
    <linearGradient id="tikkaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="25%" stop-color="#ffd56b"/>
      <stop offset="60%" stop-color="#d49b18"/>
      <stop offset="100%" stop-color="#7a5500"/>
    </linearGradient>
    <radialGradient id="tikkaRuby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b91"/>
      <stop offset="45%" stop-color="#d61c4e"/>
      <stop offset="85%" stop-color="#800b28"/>
      <stop offset="100%" stop-color="#400010"/>
    </radialGradient>
    <radialGradient id="tikkaEmerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8affc4"/>
      <stop offset="40%" stop-color="#00ab6b"/>
      <stop offset="85%" stop-color="#025e3b"/>
      <stop offset="100%" stop-color="#002d1c"/>
    </radialGradient>
    <radialGradient id="tikkaPearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fdf9f0"/>
      <stop offset="85%" stop-color="#ebe0c7"/>
      <stop offset="100%" stop-color="#bda984"/>
    </radialGradient>
    <filter id="tikkaShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tikkaShadow)">
    <!-- 1. Hairline Hook and Hanging Pearl Chain (Top) -->
    <!-- Top Hook -->
    <path d="M 70 8 C 65 8, 65 18, 70 18 C 75 18, 75 8, 70 8 Z" fill="url(#tikkaGold)" stroke="#b8860b" stroke-width="1.5"/>
    
    <!-- Delicate Pearl Strand Hanging Along Center Hair Parting -->
    <line x1="70" y1="18" x2="70" y2="105" stroke="#e5b438" stroke-width="2"/>
    <circle cx="70" cy="28" r="3.5" fill="url(#tikkaPearl)"/>
    <circle cx="70" cy="40" r="3.5" fill="url(#tikkaPearl)"/>
    <circle cx="70" cy="52" r="3.8" fill="url(#tikkaRuby)"/>
    <circle cx="70" cy="64" r="3.8" fill="url(#tikkaPearl)"/>
    <circle cx="70" cy="76" r="4.0" fill="url(#tikkaPearl)"/>
    <circle cx="70" cy="88" r="4.2" fill="url(#tikkaRuby)"/>
    <circle cx="70" cy="100" r="4.5" fill="url(#tikkaPearl)"/>

    <!-- 2. Central Papidi Billa / Forehead Medallion (Starts at y=105) -->
    <g transform="translate(70, 140)">
      <!-- Outer Filigree Gold Petals -->
      <circle cx="0" cy="0" r="32" fill="url(#tikkaGold)" stroke="#996515" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#fff8cc" stroke-width="2" stroke-dasharray="2,3"/>

      <!-- Halo of Kemp Rubies (8 gems) -->
      <circle cx="0" cy="-21" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="15" cy="-15" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="21" cy="0" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="15" cy="15" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="0" cy="21" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="-15" cy="15" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="-21" cy="0" r="4" fill="url(#tikkaRuby)"/>
      <circle cx="-15" cy="-15" r="4" fill="url(#tikkaRuby)"/>

      <!-- Center Emerald Cabochon -->
      <circle cx="0" cy="0" r="11" fill="url(#tikkaEmerald)" stroke="#ffd700" stroke-width="1.5"/>
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.7"/>

      <!-- 3. Bottom Hanging Pearl & Ruby Drops -->
      <!-- Left drops -->
      <line x1="-18" y1="26" x2="-20" y2="40" stroke="#d49b18" stroke-width="1.5"/>
      <circle cx="-20" cy="45" r="4" fill="url(#tikkaPearl)"/>

      <line x1="-9" y1="30" x2="-10" y2="46" stroke="#d49b18" stroke-width="1.5"/>
      <circle cx="-10" cy="51" r="4.5" fill="url(#tikkaPearl)"/>

      <!-- Center Grand Pearl + Ruby Drop -->
      <line x1="0" y1="32" x2="0" y2="50" stroke="#d49b18" stroke-width="2"/>
      <circle cx="0" cy="53" r="3.5" fill="url(#tikkaRuby)"/>
      <circle cx="0" cy="63" r="6.5" fill="url(#tikkaPearl)"/>
      <circle cx="-2" cy="61" r="1.8" fill="#ffffff" opacity="0.8"/>
      <circle cx="0" cy="72" r="2" fill="url(#tikkaGold)"/>

      <!-- Right drops -->
      <line x1="9" y1="30" x2="10" y2="46" stroke="#d49b18" stroke-width="1.5"/>
      <circle cx="10" cy="51" r="4.5" fill="url(#tikkaPearl)"/>

      <line x1="18" y1="26" x2="20" y2="40" stroke="#d49b18" stroke-width="1.5"/>
      <circle cx="20" cy="45" r="4" fill="url(#tikkaPearl)"/>
    </g>
  </g>
</svg>
