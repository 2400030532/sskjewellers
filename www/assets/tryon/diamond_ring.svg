<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="30%" stop-color="#ffd56b"/>
      <stop offset="70%" stop-color="#c99700"/>
      <stop offset="100%" stop-color="#6e4a00"/>
    </linearGradient>
    <radialGradient id="diamondShine" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e8f4f8"/>
      <stop offset="80%" stop-color="#b8d8e8"/>
      <stop offset="100%" stop-color="#88b0c8"/>
    </radialGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#ringGlow)">
    <!-- 1. Gold Ring Band (Circlet) -->
    <ellipse cx="80" cy="95" rx="42" ry="32" fill="none" stroke="url(#goldBand)" stroke-width="12"/>
    <ellipse cx="80" cy="95" rx="42" ry="32" fill="none" stroke="#fff8cc" stroke-width="2" stroke-dasharray="4,6"/>

    <!-- 2. Crown / Prong Setting -->
    <path d="M 66 65 L 72 45 L 88 45 L 94 65 Z" fill="url(#goldBand)" stroke="#996515" stroke-width="1.5"/>
    <!-- 4 Prongs -->
    <circle cx="68" cy="45" r="3" fill="#fff8cc"/>
    <circle cx="92" cy="45" r="3" fill="#fff8cc"/>
    <circle cx="74" cy="41" r="2.5" fill="#fff8cc"/>
    <circle cx="86" cy="41" r="2.5" fill="#fff8cc"/>

    <!-- 3. Brilliant Cut Solitaire Diamond -->
    <polygon points="80,24 98,38 90,52 70,52 62,38" fill="url(#diamondShine)" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="80,24 88,38 80,48 72,38" fill="#ffffff" opacity="0.85"/>
    <line x1="80" y1="24" x2="80" y2="48" stroke="#88b0c8" stroke-width="1"/>
    <line x1="72" y1="38" x2="88" y2="38" stroke="#88b0c8" stroke-width="1"/>

    <!-- Sparkle Stars -->
    <path d="M 98 28 Q 104 28 104 22 Q 104 28 110 28 Q 104 28 104 34 Q 104 28 98 28 Z" fill="#ffffff"/>
    <path d="M 60 48 Q 64 48 64 44 Q 64 48 68 48 Q 64 48 64 52 Q 64 48 60 48 Z" fill="#ffffff"/>
  </g>
</svg>
